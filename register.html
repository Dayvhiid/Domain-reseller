<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Create account — DomainPlatform</title>
  <meta name="description" content="Create a DomainPlatform account." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/output.css">
  <style>
    :root {
      --bg: #0A0A0C;
      --bg-elevated: #141417;
      --text-primary: #F2F2F0;
      --text-secondary: #8B8B90;
      --accent: #00F0FF;
      --border: rgba(255,255,255,0.08);
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #F5F5F7;
        --bg-elevated: #FFFFFF;
        --text-primary: #1D1D1F;
        --text-secondary: #6E6E73;
        --accent: #00A8E8;
        --border: rgba(0,0,0,0.08);
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background-color: #000000;
      color: #f4f4f5;
    }
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .auth-wrap {
      width: 100%;
      max-width: 28rem;
      margin: 0 auto;
    }
    .auth-card {
      width: 100%;
      background-color: #18181b;
      border: 1px solid #27272a;
      border-radius: 1rem;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
      padding: 2.5rem;
    }
    @media (max-width: 400px) {
      .auth-card { padding: 1.75rem; }
    }
    .auth-logo {
      display: inline-flex;
      align-items: center;
      gap: .5rem;
      font-family: "Syne", sans-serif;
      font-weight: 700;
      font-size: 1rem;
      color: #ffffff;
      text-decoration: none;
      margin-bottom: 2rem;
    }
    .auth-logo-icon {
      display: grid;
      place-items: center;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background-color: #22d3ee;
      color: #000;
      font-size: .875rem;
      font-weight: 700;
    }
    .auth-title {
      font-family: "Syne", sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.02em;
      margin-bottom: .25rem;
    }
    .auth-sub {
      font-size: .8125rem;
      color: #71717a;
      margin-bottom: 1.75rem;
    }
    .auth-field {
      margin-bottom: 1.25rem;
    }
    .auth-label {
      display: block;
      font-size: .8125rem;
      font-weight: 500;
      color: #d4d4d8;
      margin-bottom: .5rem;
    }
    .auth-input {
      width: 100%;
      background-color: #09090b;
      border: 1px solid #27272a;
      border-radius: .5rem;
      padding: .75rem 1rem;
      font-size: .9375rem;
      color: #ffffff;
      font-family: inherit;
      transition: border-color .15s ease-out, box-shadow .15s ease-out;
      outline: none;
    }
    .auth-input::placeholder { color: #52525b; }
    .auth-input:focus {
      border-color: #06b6d4;
      box-shadow: 0 0 0 2px rgba(6,182,212,0.15);
    }
    .auth-terms {
      display: flex;
      align-items: flex-start;
      gap: .5rem;
      margin-bottom: 1.5rem;
      font-size: .8125rem;
      color: #a1a1aa;
      line-height: 1.5;
    }
    .auth-terms input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin-top: 2px;
      accent-color: #06b6d4;
      cursor: pointer;
      flex-shrink: 0;
    }
    .auth-terms a {
      color: #22d3ee;
      text-decoration: none;
      transition: color .15s ease-out;
    }
    .auth-terms a:hover {
      color: #67e8f9;
      text-decoration: underline;
    }
    .auth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: .75rem;
      font-size: .9375rem;
      font-weight: 600;
      color: #000;
      background-color: #22d3ee;
      border: none;
      border-radius: .5rem;
      cursor: pointer;
      font-family: inherit;
      transition: background-color .15s ease-out, box-shadow .15s ease-out;
      box-shadow: 0 0 15px rgba(6,182,212,0.25);
      min-height: 48px;
    }
    .auth-btn:hover {
      background-color: #67e8f9;
      box-shadow: 0 0 24px rgba(6,182,212,0.4);
    }
    .auth-btn:active { transform: scale(.98); }
    .auth-footer {
      text-align: center;
      margin-top: 1.5rem;
      font-size: .8125rem;
      color: #71717a;
    }
    .auth-footer a {
      color: #22d3ee;
      text-decoration: none;
      font-weight: 500;
      transition: color .15s ease-out;
    }
    .auth-footer a:hover { color: #67e8f9; }
    .auth-disclaimer {
      text-align: center;
      font-size: .6875rem;
      color: #3f3f46;
      margin-top: 1.5rem;
    }
    .auth-error {
      display: none;
      font-size: .75rem;
      color: #f87171;
      margin-top: .375rem;
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="auth-page">
    <div class="auth-wrap">
      <div class="auth-card">
        <a href="index.html" class="auth-logo">
          <span class="auth-logo-icon">◈</span>
          <span>DomainPlatform</span>
        </a>

        <h1 class="auth-title">Create your account</h1>
        <p class="auth-sub">No real account created — frontend prototype.</p>

        <form data-validate novalidate onsubmit="event.preventDefault(); const p=document.getElementById('pwd').value, cp=document.getElementById('cpwd').value; if(p!==cp){toast('Passwords do not match','error'); return;} if(!this.checkValidity()){this.reportValidity(); return;} toast('Account created (mock). Redirecting...','success'); setTimeout(()=>location.href='client-dashboard.html',600);">
          <div class="auth-field">
            <label class="auth-label" for="name">Full name</label>
            <input id="name" required class="auth-input" placeholder="Ada Lovelace" />
            <p data-error class="auth-error">Required</p>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="email">Email</label>
            <input id="email" type="email" required class="auth-input" placeholder="ada@example.com" />
            <p data-error class="auth-error">Valid email required</p>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="pwd">Password</label>
            <input id="pwd" type="password" required minlength="6" class="auth-input" placeholder="Min 6 characters" />
            <p data-error class="auth-error">Min 6 characters</p>
          </div>

          <div class="auth-field">
            <label class="auth-label" for="cpwd">Confirm password</label>
            <input id="cpwd" type="password" required class="auth-input" placeholder="Re-enter password" />
            <p data-error class="auth-error">Required</p>
          </div>

          <label class="auth-terms">
            <input type="checkbox" required />
            <span>I agree to the <a href="legal/terms.html">Terms</a> and <a href="legal/privacy.html">Privacy Policy</a>.</span>
          </label>

          <button type="submit" class="auth-btn">Create account</button>
        </form>

        <p class="auth-footer">Already have an account? <a href="login.html">Log in</a></p>
      </div>

      <p class="auth-disclaimer">Mock data only.</p>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-4 right-4 z-50 w-80 space-y-2 pointer-events-none"></div>
  <script src="js/mock-data.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/navigation.js"></script>
  <script src="js/domain-search.js"></script>
  <script src="js/ui.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
